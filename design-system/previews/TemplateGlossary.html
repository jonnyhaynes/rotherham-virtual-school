<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/components/bundle.css"><script src="/lib/react.production.min.js"></script><script src="/lib/react-dom.production.min.js"></script><script src="/components/bundle.js"></script><meta charset="utf-8"><title>TemplateGlossary</title></head>
<body>
<div id="root"></div>
<script>
var R = window.RVS, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'rvs-page'},h(R.SkipLink,null),h(R.Header,{navigation:[{label:'Young people',href:'#'},{label:'Parents and carers',href:'#'},{label:'Schools',href:'#'},{label:'Social workers',href:'#'},{label:'Professionals',href:'#'}]}),h('main',{id:'main-content'},h(R.Hero,{variant:'compact',title:'Words we use',lead:'Education and social care use a lot of jargon. Here’s what it means, in plain English.',breadcrumbs:[{label:'Home',href:'#'},{label:'Words we use'}]}),
 h('div',{className:'rvs-main'},h(R.Glossary,{terms:[
{term:'Care leaver',definition:'A young person aged 16 or over who has been in care and is leaving, or has left. Support from a personal adviser can carry on until 25.'},
{term:'Child in care',definition:'A child or young person looked after by the council. Some people say “looked-after child” instead.'},
{term:'Designated teacher',expansion:'DT',definition:'The teacher in every school who is responsible for the education of children in care and previously looked-after children.'},
{term:'EHCP',expansion:'Education, health and care plan',definition:'A legal plan for a child with special educational needs that sets out the support they must get.'},
{term:'ePEP',expansion:'Electronic Personal Education Plan',definition:'The online system schools, social workers and the Virtual School use to complete PEPs.'},
{term:'EYPP',expansion:'Early Years Pupil Premium',definition:'Extra funding for nurseries and early years settings for eligible children aged 3 and 4.'},
{term:'IFA',expansion:'Independent fostering agency',definition:'An organisation, separate from the council, that recruits and supports foster carers.'},
{term:'IRO',expansion:'Independent reviewing officer',definition:'The person who chairs a child’s care plan reviews and checks the plan is working.'},
{term:'LAC',expansion:'Looked-after child',definition:'An older term for a child in care. You will still see it in some documents.'},
{term:'Local Offer',definition:'The council’s directory of support for children with special educational needs and disabilities.'},
{term:'PA',expansion:'Personal adviser',definition:'The person who helps a care leaver plan for education, work and life after school, up to age 25.'},
{term:'PEP',expansion:'Personal Education Plan',definition:'A plan about a child’s learning: what they are good at, what help they need and their goals. It is reviewed three times a year.',href:'#'},
{term:'PLAC',expansion:'Previously looked-after child',definition:'A child who has left care through adoption, a special guardianship order or a child arrangements order.'},
{term:'PP+',expansion:'Pupil Premium Plus',definition:'Extra money paid to schools for children in care and previously looked-after children, to pay for what is in the PEP.'},
{term:'SEMH',expansion:'Social, emotional and mental health',definition:'A type of special educational need linked to feelings, behaviour and wellbeing.'},
{term:'SEND',expansion:'Special educational needs and disabilities',definition:'When a child needs extra help to learn because of a learning difficulty or disability.'},
{term:'SGO',expansion:'Special guardianship order',definition:'A court order that makes someone, often a relative, a child’s special guardian until they are 18.'},
{term:'Virtual School',definition:'Not a building. A team of people whose job is to make sure children in care are doing well at school.'}
]})),h('div',{className:'rvs-container'},h(R.PageFeedback,null))),h(R.Footer,{links:[{label:'Our team',href:'#'},{label:'Training and events',href:'#'},{label:'News',href:'#'},{label:'Documents and policies',href:'#'},{label:'Words we use',href:'#'},{label:'Contact us',href:'#'},{label:'Accessibility statement',href:'#'},{label:'Privacy and cookies',href:'#'}],partner:h(R.Link,{href:'https://www.rotherham.gov.uk/',variant:'inverse'},'Rotherham Council services')}))
