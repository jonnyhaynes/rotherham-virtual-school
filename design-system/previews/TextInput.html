<!doctype html>
<html lang="en" data-theme="light">
<head><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/components/bundle.css"><script src="/lib/react.production.min.js"></script><script src="/lib/react-dom.production.min.js"></script><script src="/components/bundle.js"></script><meta charset="utf-8"><title>TextInput</title></head>
<body>
<div id="root"></div>
<script>
var R = window.RVS, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'rvs-demo',style:{maxWidth:'560px'}},
 h(R.TextInput,{label:'Full name',autoComplete:'name'}),
 h(R.TextInput,{label:'School URN',hint:'The 6-digit number on your school’s Get Information about Schools page',width:'10',inputMode:'numeric'}),
 h(R.TextInput,{label:'Email address',type:'email',error:'Enter an email address in the correct format, like name@school.org.uk',defaultValue:'name@'}),
 h(R.TextInput,{label:'What would you like to talk about?',multiline:true,rows:3,optional:true}))
);
</script>
</body>
</html>
