<div id="root"></div>

var R = window.RVS, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'rvs-page'},h(R.SkipLink,null),h(R.Header,{navigation:[{label:'Young people',href:'#'},{label:'Parents and carers',href:'#'},{label:'Schools',href:'#'},{label:'Social workers',href:'#'},{label:'Professionals',href:'#'}]}),h('main',{id:'main-content'},h(R.Hero,{variant:'compact',title:'News',lead:'Updates from the Virtual School, including newsletters and annual reports.',breadcrumbs:[{label:'Home',href:'#'},{label:'News'}]}),
