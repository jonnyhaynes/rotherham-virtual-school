<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div id="root"></div>
<script>
var R = window.RVS, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div',{className:'rvs-demo'},
 h(R.Panel,{tone:'pep',title:'Your role in the PEP',icon:'users',actions:h(R.Link,{href:'#',variant:'arrow'},'Find out more about your role')},h('p',null,'As a carer, you know the child best. Your views, experiences and knowledge are invaluable in shaping their PEP.')),
 h(R.Panel,{tone:'help',title:'If something isn’t going right',actions:h(R.Link,{href:'#',variant:'arrow'},'Get help and support')},h('p',null,'If you’re worried about your education, need advice or something isn’t working, please get in touch. We’re here to help.')),
 h(R.Panel,{tone:'advice',title:'Eligibility'},h('p',null,'Pupil Premium Plus is available for children looked after by Rotherham and previously looked-after children in Rotherham schools.')),
 h(R.Panel,{tone:'neutral'},h('p',null,'It can take up to 10 working days to process a funding request.')),
 h(R.Panel,{tone:'warning',label:'Warning'},h('p',null,'Submit PEPs at least 5 working days before the end of term.')))
);
</script>
</body>
</html>
